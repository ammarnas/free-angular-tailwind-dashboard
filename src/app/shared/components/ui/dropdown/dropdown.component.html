@if (isOpen) {
<div
  #dropdownRef
  class="absolute z-40 mt-2 rounded-xl border border-gray-300 bg-white shadow-theme-lg dark:border-white/10 dark:bg-gray-dark"
  [ngClass]="[className.includes('right-') || className.includes('left-') || className.includes('start-') || className.includes('end-') ? '' : 'ltr:right-0 rtl:left-0', className]"
>
  <ng-content></ng-content>
</div>
}
