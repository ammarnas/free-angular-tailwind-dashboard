<div class="rounded-2xl border border-gray-300 bg-white dark:border-white/10 dark:bg-white/[0.03] {{ className }}">
  <!-- Card Header -->
  <div class="px-6 py-5">
    <h3 class="text-base font-medium text-gray-950 dark:text-gray-100">
      {{ title }}
    </h3>
    @if (desc) {
    <p class="mt-1 text-sm text-gray-700 dark:text-gray-400">
      {{ desc }}
    </p>
    }
  </div>

  <!-- Card Body -->
  <div class="p-4 border-t border-gray-200 dark:border-white/10 sm:p-6">
    <div class="space-y-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
