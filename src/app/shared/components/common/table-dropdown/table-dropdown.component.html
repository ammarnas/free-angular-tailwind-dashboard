<div>
  <div #buttonRef class="cursor-pointer">
    <ng-content select="[dropdown-button]"></ng-content>
  </div>
  <div class="z-99999 fixed" #contentRef>
    <div 
      [ngStyle]="{ display: isOpen ? 'block' : 'none' }" 
      class="p-2 bg-white border border-gray-300 rounded-2xl shadow-lg dark:border-white/10 dark:bg-gray-950 w-40"
      role="menu"
      aria-orientation="vertical"
      aria-labelledby="options-menu"
    >
      <div class="space-y-1">
        <ng-content select="[dropdown-content]"></ng-content>
      </div>
    </div>
  </div>
</div>
