<div class="relative p-6 bg-white z-1 dark:bg-gray-950 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-950 sm:p-0"
  >
    <ng-content></ng-content>
    <!-- The single sanctioned gradient (§2.6) lives on the login hero panel. -->
    <div
      class="items-center hidden w-full h-full lg:w-1/2 bg-brand-hero lg:grid relative"
    >
      <div class="flex items-center justify-center z-1">
        <!-- ===== Common Grid Shape Start ===== -->
        <app-grid-shape />
        <div class="flex flex-col items-center max-w-xs">
          <!-- Stacked knockout lockup: the login page is a square-ish space
               on a dark ground. 232px clears the 96px minimum. -->
          <a routerLink="/" class="block mb-6 rounded-lg">
            <img
              width="232"
              height="106"
              src="/brand/logo-stacked-knockout.svg"
              alt="الهيئة العامة للمنافذ والجمارك — General Authority for Borders and Customs"
            />
          </a>
          <p class="text-center text-gray-100/70 leading-relaxed">
            المنظومة الموحدة لإدارة المنافذ والإجراءات الجمركية
          </p>
        </div>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 end-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
